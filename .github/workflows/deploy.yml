name: Deploy to SiteGround

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    env:
      FTP_DIR_DHUNE: ${{ secrets.FTP_DIR_DHUNE }}
      FTP_DIR_RIMINICALCIO: ${{ secrets.FTP_DIR_RIMINICALCIO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SMTP config
        env:
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          cat > smtp-config.php <<PHP
          <?php
          return [
              'host'     => 'smtp.gmail.com',
              'port'     => 587,
              'username' => 'comunicazioni@forini.com',
              'password' => '${SMTP_APP_PASSWORD}',
          ];
          PHP

      - name: Deploy to SiteGround via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          state-name: "ftp-deploy-state.json"
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/README.md
            dhune/**
            riminicalcio/**

      - name: Build DHUNE subdomain bundle
        if: ${{ env.FTP_DIR_DHUNE != '' }}
        run: |
          mkdir build-dhune
          cp -r dhune/. build-dhune/
          cp -r lib build-dhune/lib
          cp smtp-config.php build-dhune/smtp-config.php

      - name: Deploy DHUNE subdomain via FTP
        if: ${{ env.FTP_DIR_DHUNE != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR_DHUNE }}
          local-dir: ./build-dhune/
          state-name: "ftp-deploy-state-dhune.json"

      - name: Build Rimini Calcio subdomain bundle
        if: ${{ env.FTP_DIR_RIMINICALCIO != '' }}
        run: |
          mkdir build-riminicalcio
          cp -r riminicalcio/. build-riminicalcio/
          cp -r lib build-riminicalcio/lib
          cp smtp-config.php build-riminicalcio/smtp-config.php

      - name: Deploy Rimini Calcio subdomain via FTP
        if: ${{ env.FTP_DIR_RIMINICALCIO != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR_RIMINICALCIO }}
          local-dir: ./build-riminicalcio/
          state-name: "ftp-deploy-state-riminicalcio.json"